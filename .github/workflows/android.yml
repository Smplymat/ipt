name: Build Android APK

# Runs on every push to main, and can be started by hand from the Actions tab.
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # `npm install` (not `npm ci`) so new dependencies are picked up even if
      # package-lock.json hasn't been regenerated yet.
      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      # Creates the native Android project the first time (skipped if an
      # android/ folder is already committed).
      - name: Add Android platform
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      # Lets Android reopen the app from  com.kneadtoknow.app://payment-return
      # links, which is how the customer returns after paying with PayMongo.
      - name: Register payment return link in Android manifest
        run: |
          python3 - <<'EOF'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          if 'android:scheme="com.kneadtoknow.app"' in s:
              print('Return link already registered')
          else:
              filt = (
                  '            <intent-filter>\n'
                  '                <action android:name="android.intent.action.VIEW" />\n'
                  '                <category android:name="android.intent.category.DEFAULT" />\n'
                  '                <category android:name="android.intent.category.BROWSABLE" />\n'
                  '                <data android:scheme="com.kneadtoknow.app" android:host="payment-return" />\n'
                  '            </intent-filter>\n'
                  '        '
              )
              assert '</activity>' in s, 'MainActivity block not found in AndroidManifest.xml'
              s = s.replace('</activity>', filt + '</activity>', 1)
              open(p, 'w', encoding='utf-8').write(s)
              print('Return link registered')
          EOF

      - name: Generate app icons and splash screens
        run: npx capacitor-assets generate --android

      - name: Copy web build into Android project
        run: npx cap sync android

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: knead-to-know-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
