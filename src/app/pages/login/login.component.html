<ktk-page-header title="Sign In" [showBack]="true" backRoute="/bread-catalog" [showNotifications]="false" [transparent]="true" />

<ion-content class="page-content" [scrollY]="true">

  <div style="max-width: 420px; margin: 0 auto; padding: 40px 20px 56px;">

    <!-- ── Branding ─────────────────────────────────────────────────── -->
    <div style="text-align: center; margin-bottom: 28px;">
      <div style="width: 72px; height: 72px; border-radius: 24px; overflow: hidden; margin: 0 auto 16px; box-shadow: 0 6px 18px rgba(42, 26, 16, 0.25); border: 2px solid var(--ktk-card-border);">
        <img src="/logo.jpg" alt="Knead to Know logo" style="width: 100%; height: 100%; object-fit: cover; display: block;" (error)="$any($event.target).style.display='none'" />
      </div>
      <h1 style="font-family: var(--ktk-font-sans); font-size: 1.5rem; font-weight: 900; color: var(--ktk-text); margin: 0 0 6px; letter-spacing: -0.02em;">
        Welcome Back
      </h1>
      <p style="font-family: var(--ktk-font-sans); font-size: 0.85rem; color: var(--ktk-text-secondary); margin: 0;">
        Sign in to continue to your bakery dashboard.
      </p>
    </div>

    <!-- ── Error banner ─────────────────────────────────────────────── -->
    @if (errorMessage()) {
      <ktk-error-state
        type="server"
        [message]="errorMessage() ?? ''"
        [retryable]="false">
      </ktk-error-state>
    }

    <!-- ── Form ─────────────────────────────────────────────────────── -->
    <div class="login-form" style="background: var(--ktk-card); border: 1px solid var(--ktk-card-border); border-radius: 18px; padding: 24px; box-shadow: var(--ktk-shadow-card);">

      <ktk-form-field
        label="Email address"
        type="email"
        placeholder="you@example.com"
        [value]="email()"
        (valueChange)="email.set($event)"
        [error]="errorMessage() ? 'Invalid email or password' : ''"
        [icon]="'mail-outline'"
        [required]="true">
      </ktk-form-field>

      <ktk-form-field
        label="Password"
        type="password"
        placeholder="••••••••"
        [value]="password()"
        (valueChange)="password.set($event)"
        [error]="submitting() ? '' : ''"
        [icon]="'lock-closed-outline'"
        [required]="true">
      </ktk-form-field>

      <ktk-button
        variant="accent"
        size="lg"
        [disabled]="submitting()"
        (onClick)="handleSubmit()"
        style="--border-radius: 12px; --padding-top: 16px; --padding-bottom: 16px; --box-shadow: var(--ktk-shadow-fab); font-weight: 700; font-size: 0.9rem; height: 50px; margin-top: 8px;">
        {{ submitting() ? 'Signing in…' : 'Sign In' }}
      </ktk-button>

      <p style="font-family: var(--ktk-font-sans); font-size: 0.8rem; color: var(--ktk-text-secondary); text-align: center; margin: 18px 0 0;">
        Don't have an account?
        <a routerLink="/register" style="color: var(--ktk-text); font-weight: 700; text-decoration: none; cursor: pointer;">Create one</a>
      </p>
    </div>

    <p style="font-family: var(--ktk-font-sans); font-size: 0.72rem; color: var(--ktk-text-muted); text-align: center; margin: 20px 0 0; line-height: 1.5;">
      The first account you create is automatically promoted to Admin.<br>
      You can manage store staff roles from the Admin panel.
    </p>

  </div>

</ion-content>
