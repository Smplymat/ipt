<ktk-page-header title="Order Confirmation" [showBack]="true" backRoute="/orders" [showNotifications]="false" />

<ion-content class="page-content" [scrollY]="true">

  <!-- ── Loading ─────────────────────────────────────────────────────── -->
  @if (loading()) {
    <ktk-skeleton type="card" />
  }

  <!-- ── Error ───────────────────────────────────────────────────────── -->
  @if (!loading() && error()) {
    <ktk-error-state
      type="server"
      [message]="error() ?? ''"
      [retryable]="true"
      (onRetry)="load(orderNumber())">
    </ktk-error-state>
  }

  <!-- ── Receipt ─────────────────────────────────────────────────────── -->
  @if (!loading() && order(); as o) {

    <div class="receipt-print">

      <div style="text-align: center; padding: 8px 0 2px;" class="no-print">
        <h1 style="margin: 0; font-family: var(--ktk-font-sans); font-weight: 800; color: var(--ktk-text); font-size: 1.25rem;">
          Order confirmed! Thank you!
        </h1>
        <p style="font-family: var(--ktk-font-sans); font-size: 0.85rem; color: var(--ktk-text-secondary); margin: 4px 0 0;">
          A copy of your receipt is below — your bakers are on it.
        </p>
      </div>

      <ktk-ticket-card
        [title]="'Order #' + orderNumber()"
        [subtitle]="formatDate(o.created_at)"
        [status]="mapStatusTag(o.status)"
        [metaRows]="[
          { label: o.fulfillment_type === 'pickup' ? 'PICKUP AT' : 'DELIVER TO', value: o.fulfillment_type === 'pickup' ? 'In-Store Pickup · 123 Banawe St, Quezon City' : (o.address + (o.unit_notes ? ' · ' + o.unit_notes : '') + ' · ' + coordinates()), highlight: true },
          { label: 'Customer', value: o.customer_name + ' · ' + o.phone, highlight: false },
          { label: o.scheduled_at ? 'Scheduled' : 'Fulfillment', value: o.scheduled_at ? formatDate(o.scheduled_at) : 'ASAP', highlight: false },
          { label: 'Payment', value: paymentLabel[o.payment_method], highlight: true },
          { label: 'Items', value: o.items.length + ' item' + (o.items.length === 1 ? '' : 's'), highlight: false }
        ]"
        [items]="getTicketItems(o)"
        [actions]="getTicketActions()"
        [showDivider]="true"
        (action)="handleTicketAction($event)">
      </ktk-ticket-card>

      <p style="text-align: center; margin: 18px 0 0; font-family: var(--ktk-font-sans); font-size: 0.72rem; color: var(--ktk-text-muted);">
        Thank you for supporting Knead to Know — baked with love.
      </p>
    </div>

    <!-- Actions -->
    <div class="no-print" style="padding: 24px 20px 48px; display: flex; gap: 12px; flex-wrap: wrap;">
      <ktk-button
        variant="accent"
        size="lg"
        (onClick)="printReceipt()"
        style="--border-radius: 12px; --padding-top: 16px; --padding-bottom: 16px; font-weight: 800; font-size: 0.92rem; flex: 1; min-width: 180px;">
        Print / Save as PDF
      </ktk-button>
      <ktk-button
        routerLink="/orders"
        variant="outline"
        size="lg"
        style="--border-color: var(--ktk-text); --color: var(--ktk-text); --border-radius: 12px; --padding-top: 16px; --padding-bottom: 16px; font-weight: 700; font-size: 0.92rem; flex: 1; min-width: 180px;">
        Track My Orders
      </ktk-button>
    </div>

  }

</ion-content>
