<ktk-page-header title="Payment Cancelled" [showBack]="false" [showNotifications]="false" />

<ion-content class="page-content" [scrollY]="true">
  <div style="max-width: 480px; margin: 0 auto; padding: 60px 20px; text-align: center;">

    <div style="width: 100px; height: 100px; border-radius: 50%; margin: 0 auto 24px; display: flex; align-items: center; justify-content: center; background: var(--ktk-base); border: 3px solid var(--ktk-error);">
      <ion-icon [icon]="closeCircle" style="font-size: 3rem; color: var(--ktk-error);"></ion-icon>
    </div>

    <h1 style="font-family: var(--ktk-font-sans); font-size: 1.5rem; font-weight: 800; color: var(--ktk-text); margin: 0 0 8px;">
      Payment Cancelled
    </h1>

    <p style="font-family: var(--ktk-font-sans); font-size: 0.95rem; color: var(--ktk-text-secondary); margin: 0 0 24px; line-height: 1.6;">
      No charges were made. Your order has been saved as a draft and you can complete it anytime from your cart.
    </p>

    @if (orderId(); as id) {
      <ktk-ticket-card
        [title]="'Order Reference'"
        [subtitle]="id.replace(/-/g, '').slice(0, 10).toUpperCase()"
        [status]="'error'"
        [metaRows]="[]"
        [items]="[]"
        [actions]="[]"
        [showDivider]="false">
      </ktk-ticket-card>
    }

    <div style="display: flex; flex-direction: column; gap: 12px;">
      <ktk-button
        variant="accent"
        size="lg"
        routerLink="/checkout"
        style="--border-radius: 12px; --padding-top: 16px; --padding-bottom: 16px; --box-shadow: 0 4px 16px rgba(204, 111, 0, 0.35); font-weight: 800; font-size: 0.95rem; height: 54px;">
        <ion-icon [icon]="arrowBack" slot="start" aria-hidden="true"></ion-icon>
        Try Again
      </ktk-button>
      <ktk-button
        variant="outline"
        size="lg"
        routerLink="/orders"
        style="--color: var(--ktk-text); --border-color: var(--ktk-card-border); --border-radius: 12px; --padding-top: 14px; --padding-bottom: 14px; font-weight: 700; font-size: 0.9rem; height: 50px;">
        <ion-icon [icon]="arrowForward" slot="end" aria-hidden="true"></ion-icon>
        View Orders
      </ktk-button>
      <ktk-button
        variant="ghost"
        size="lg"
        routerLink="/bread-catalog"
        style="--color: var(--ktk-accent); font-weight: 700; font-size: 0.9rem; height: 48px;">
        Continue Shopping
      </ktk-button>
    </div>

  </div>
</ion-content>
