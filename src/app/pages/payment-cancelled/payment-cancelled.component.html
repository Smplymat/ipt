<ion-header>
  <ion-toolbar>
    <ion-title>Payment Cancelled</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="page-content" [scrollY]="true">
  <div style="max-width: 480px; margin: 0 auto; padding: 60px 20px; text-align: center;">

    <div style="width: 100px; height: 100px; border-radius: 50%; margin: 0 auto 24px; display: flex; align-items: center; justify-content: center; background: var(--bakery-base); border: 3px solid var(--bakery-error);">
      <ion-icon [icon]="closeCircle" style="font-size: 3rem; color: var(--bakery-error);"></ion-icon>
    </div>

    <h1 style="font-family: var(--bakery-font); font-size: 1.5rem; font-weight: 800; color: var(--bakery-dark); margin: 0 0 8px;">
      Payment Cancelled
    </h1>

    <p style="font-family: var(--bakery-font); font-size: 0.95rem; color: var(--bakery-text-secondary); margin: 0 0 24px; line-height: 1.6;">
      No charges were made. Your order has been saved as a draft and you can complete it anytime from your cart.
    </p>

    @if (orderId(); as id) {
      <div class="bakery-card" style="text-align: left; padding: 20px; margin-bottom: 24px;">
        <p style="font-family: var(--bakery-font); font-size: 0.78rem; font-weight: 700; color: var(--bakery-text-muted); letter-spacing: 0.5px; text-transform: uppercase; margin: 0 0 8px;">Order Reference</p>
        <p style="font-family: var(--bakery-font); font-weight: 700; color: var(--bakery-dark); font-size: 0.85rem; margin: 0;">{{ id.replace(/-/g, '').slice(0, 10).toUpperCase() }}</p>
      </div>
    }

    <div style="display: flex; flex-direction: column; gap: 12px;">
      <ion-button
        expand="block"
        routerLink="/checkout"
        style="--background: var(--bakery-burnt); --background-hover: var(--bakery-burnt); --background-activated: var(--bakery-burnt); --color: var(--bakery-dark); --border-radius: 12px; --padding-top: 16px; --padding-bottom: 16px; --box-shadow: 0 4px 16px rgba(204, 111, 0, 0.35); font-weight: 800; font-size: 0.95rem; height: 54px;"
      >
        <ion-icon [icon]="arrowBack" slot="start" aria-hidden="true"></ion-icon>
        Try Again
      </ion-button>
      <ion-button
        expand="block"
        fill="outline"
        routerLink="/orders"
        style="--color: var(--bakery-dark); --border-color: var(--bakery-card-border); --border-radius: 12px; --padding-top: 14px; --padding-bottom: 14px; font-weight: 700; font-size: 0.9rem; height: 50px;"
      >
        <ion-icon [icon]="arrowForward" slot="end" aria-hidden="true"></ion-icon>
        View Orders
      </ion-button>
      <ion-button
        expand="block"
        fill="clear"
        routerLink="/bread-catalog"
        style="--color: var(--bakery-burnt); font-weight: 700; font-size: 0.9rem; height: 48px;"
      >
        Continue Shopping
      </ion-button>
    </div>

  </div>
</ion-content>
